<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtitall</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 13h7M6 16h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>Subtitall</span>
      </div>
      <nav class="tabs" aria-label="Main navigation">
        <button class="tab" data-view="files">Files</button>
        <button class="tab" data-view="rename">Rename</button>
        <button class="tab" data-view="settings">Settings</button>
      </nav>
      <div class="top-right">
        <span id="top-progress" hidden><span class="spin"></span> <span id="top-progress-text"></span></span>
        <span id="top-version" class="version"></span>
      </div>
    </header>

    <main id="main"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="drop-overlay"><div class="drop-message">Drop videos or folders to add them</div></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
