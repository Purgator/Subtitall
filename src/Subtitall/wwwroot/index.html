<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtitall</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <nav id="activity-bar" aria-label="Main navigation">
      <button class="activity-btn" data-view="files" title="Files">
        <svg viewBox="0 0 24 24"><path d="M4 4h6l2 2h8a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button class="activity-btn" data-view="rename" title="Rename episodes">
        <svg viewBox="0 0 24 24"><path d="M16.5 4.5l3 3L8 19H5v-3L16.5 4.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 7l3 3" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <div class="activity-spacer"></div>
      <button class="activity-btn" data-view="settings" title="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.8l1 2.7 2.8-.5 1.2 2.6 2.7 1-.5 2.8 1.9 2.1-1.9 2.1.5 2.8-2.7 1-1.2 2.6-2.8-.5-1 2.7-1-2.7-2.8.5-1.2-2.6-2.7-1 .5-2.8L2.9 12l1.9-2.1-.5-2.8 2.7-1L8.2 3.5l2.8.5z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
      </button>
    </nav>

    <aside id="sidebar"></aside>

    <main id="main"></main>

    <footer id="status-bar">
      <div class="status-left">
        <span id="status-version"></span>
        <span id="status-providers"></span>
      </div>
      <div class="status-right">
        <span id="status-progress">Ready</span>
      </div>
    </footer>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="drop-overlay"><div class="drop-message">Drop videos or folders to add them</div></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
